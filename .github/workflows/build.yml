name: Tiny Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nightly
        run: rustup toolchain install nightly && rustup target add ${{ matrix.target }}
      - name: Add Rust Source
        run: rustup component add rust-src --toolchain nightly
      - name: Build
        # We override the target in the command so it ignores your local MacOS config
        run: cargo +nightly build --release -Z build-std=core,compiler_builtins -Z build-std-features=panic_immediate_abort --target ${{ matrix.target }}

